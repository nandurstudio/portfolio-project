services:
  # Nginx reverse proxy
  nginx:
    image: nginx:1.24-alpine
    container_name: portfolio_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./services/nginx/ssl:/etc/nginx/ssl:ro
      - ./web:/var/www/html:ro
      - ./apps/laravel/public:/var/www/laravel/public:ro
    depends_on:
      - php
      - flask
      - n8n
    networks:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PHP-FPM for Laravel
  php:
    build:
      context: ./apps/laravel
      dockerfile: ../../services/php/Dockerfile
    container_name: portfolio_php
    working_dir: /var/www/laravel
    volumes:
      - ./apps/laravel:/var/www/laravel
      - php_vendor:/var/www/laravel/vendor
      - ./web/kkmrat:/var/www/html/kkmrat
      - ./web/undangan:/var/www/html/undangan
      - ./web/kkmsmartvote:/var/www/html/kkmsmartvote
    environment:
      # Main Laravel App (MySQL)
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-portfolio}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      # KKMRat web app (used by web/kkmrat/php/connection.php)
      - KKMRAT_DB_USER=${KKMRAT_DB_USER}
      - KKMRAT_DB_PASS=${KKMRAT_DB_PASS}
      - KKMRAT_DB_NAME=${KKMRAT_DB_NAME}
      # KKMSmartVote database (MySQL koperasi_vote)
      - KOPERASI_DB_CONNECTION=mysql
      - KOPERASI_DB_HOST=db
      - KOPERASI_DB_PORT=3306
      - KOPERASI_DB_DATABASE=koperasi_vote
      - KOPERASI_DB_USERNAME=${DB_USERNAME:-portfolio_user}
      - KOPERASI_DB_PASSWORD=${DB_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    mem_limit: 384m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: portfolio_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./services/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Database for n8n
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    environment:
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: ${N8N_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Flask API (future)
  flask:
    build:
      context: ./apps/flask
      dockerfile: ../../services/flask/Dockerfile
    container_name: portfolio_flask
    working_dir: /app
    volumes:
      - ./apps/flask:/app
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=mysql+pymysql://${DB_USERNAME}:${DB_PASSWORD}@db:3306/${DB_DATABASE}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # n8n Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: portfolio_n8n
    environment:
      - N8N_HOST=nandurstudio.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - N8N_PATH=/n8n
      - N8N_EDITOR_BASE_URL=https://nandurstudio.com/n8n/
      - WEBHOOK_URL=https://nandurstudio.com/
      - GENERIC_TIMEZONE=Asia/Jakarta
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
      - N8N_LOG_LEVEL=info
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME}
      - DB_POSTGRESDB_USER=${N8N_DB_USER}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Node-RED Workflow Automation
  nodered:
    image: nodered/node-red:latest
    container_name: portfolio_nodered
    environment:
      - TZ=Asia/Jakarta
      - NODE_ENV=production
      - NODE_RED_ENABLE_PROJECTS=false
      - NODERED_CREDENTIAL_SECRET=${NODERED_CREDENTIAL_SECRET}
      - NODERED_ADMIN_USER=${NODERED_ADMIN_USER:-admin}
      - NODERED_ADMIN_PASSWORD_HASH=${NODERED_ADMIN_PASSWORD_HASH}
    volumes:
      - nodered_data:/data
      - ./services/nodered/settings.js:/data/settings.js:ro
    networks:
      - backend
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:1880/nodered/', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Node-RED User Workspace (isolated flow set)
  nodered_user:
    image: nodered/node-red:latest
    container_name: portfolio_nodered_user
    environment:
      - TZ=Asia/Jakarta
      - NODE_ENV=production
      - NODE_RED_ENABLE_PROJECTS=false
      - NODERED_USER_CREDENTIAL_SECRET=${NODERED_USER_CREDENTIAL_SECRET}
      - NODERED_USER_ADMIN_USER=${NODERED_USER_BASIC_AUTH_USER:-user}
      - NODERED_USER_PASSWORD_HASH=${NODERED_USER_PASSWORD_HASH}
    volumes:
      - nodered_user_data:/data
      - ./services/nodered/settings-user.js:/data/settings.js:ro
    networks:
      - backend
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:1880/nodered-user/', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge

volumes:
  db_data:
    driver: local
    name: portfolio_db_data
  postgres_data:
    driver: local
    name: portfolio_postgres_data
  n8n_data:
    driver: local
    name: portfolio_n8n_data
  nodered_data:
    driver: local
    name: portfolio_nodered_data
  nodered_user_data:
    driver: local
    name: portfolio_nodered_user_data
  php_vendor:
    driver: local
    name: portfolio_php_vendor
